[project]
name = "facelock"
version = "0.1.0"
description = "Face recognition door lock system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "face-recognition>=1.3.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "setuptools<68",
    "pyserial>=3.5",
]

[project.scripts]
facelock = "main:main"
